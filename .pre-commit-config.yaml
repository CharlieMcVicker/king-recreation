repos:
  - repo: https://github.com/PyCQA/autoflake
    rev: v2.2.1
    hooks:
      - id: autoflake
        args: [--remove-all-unused-imports, --in-place]
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
  # Using this mirror lets us use mypyc-compiled black, which is about 2x faster
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.1.0
    hooks:
      - id: black
        # It is recommended to specify the latest version of Python
        # supported by your project here, or alternatively use
        # pre-commit's default_language_version, see
        # https://pre-commit.com/#top_level-default_language_version
        language_version: python3.13
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: .venv/bin/pytest
        language: system
        pass_filenames: false
        always_run: true
      - id: pyright-king-recreation
        name: Pyright (king_recreation)
        entry: npx basedpyright --level error king_recreation
        language: system
        pass_filenames: false
        always_run: true
      - id: pyright-tests
        name: Pyright (tests)
        entry: npx basedpyright --level error tests
        language: system
        pass_filenames: false
        always_run: true
      - id: pyright-tex-dictionary
        name: Pyright (tex_dictionary)
        entry: npx basedpyright --level error tex_dictionary
        language: system
        pass_filenames: false
        always_run: true
